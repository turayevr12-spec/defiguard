[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defiguard"
version = "0.1.0"
description = "Heuristic Solidity/DeFi security review helper: flags suspicious patterns to review, backed by Foundry test scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeFiGuard contributors" }]
keywords = ["solidity", "security", "defi", "static-analysis", "foundry", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/OWNER/defiguard"
Issues = "https://github.com/OWNER/defiguard/issues"

[project.scripts]
defiguard = "defiguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
